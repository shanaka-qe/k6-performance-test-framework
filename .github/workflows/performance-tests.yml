# GitHub Actions Workflow for k6 Performance Testing
# Runs performance tests on PR, merge, and scheduled intervals

name: Performance Tests

on:
  # Trigger on pull request
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'scripts/**'
      - 'lib/**'
      - 'env/**'
      - '.github/workflows/performance-tests.yml'

  # Trigger on push to main
  push:
    branches:
      - main

  # Scheduled runs (nightly at 2 AM UTC)
  schedule:
    - cron: '0 2 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
          - soak
          - spike
      environment:
        description: 'Target environment'
        required: true
        default: 'sit'
        type: choice
        options:
          - dev
          - sit
          - uat

# Environment variables
env:
  K6_VERSION: '0.48.0'

jobs:
  # ===========================================================================
  # Job 1: Lint and Type Check
  # ===========================================================================
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: TypeScript type check
        run: npm run type-check

  # ===========================================================================
  # Job 2: Smoke Tests (Always run on PR)
  # ===========================================================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request' || github.event.inputs.test_type == 'smoke'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ env.K6_VERSION }}

      - name: Run smoke test
        run: |
          k6 run \
            --out json=results/smoke-results.json \
            --env ENV=${{ github.event.inputs.environment || 'sit' }} \
            scripts/smoke/api_smoke.ts
        env:
          BASE_URL: ${{ secrets.BASE_URL_SIT }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: smoke-test-results
          path: results/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('results/smoke-results.json', 'utf8'));
            const comment = `## 🔥 Smoke Test Results
            
            - **Status**: ${results.root_group.checks ? '✅ Passed' : '❌ Failed'}
            - **Duration**: ${results.state.testRunDurationMs}ms
            - **Requests**: ${results.metrics.http_reqs.values.count}
            - **Error Rate**: ${(results.metrics.http_req_failed.values.rate * 100).toFixed(2)}%
            
            [View full results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ===========================================================================
  # Job 3: Load Tests (Merge to main or scheduled)
  # ===========================================================================
  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    needs: lint
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event.inputs.test_type == 'load'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ env.K6_VERSION }}

      - name: Run load test
        run: |
          k6 run \
            --out json=results/load-results.json \
            --env ENV=${{ github.event.inputs.environment || 'sit' }} \
            scripts/load/api_load_mainflow.ts
        env:
          BASE_URL: ${{ secrets.BASE_URL_SIT }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          VUS: ${{ vars.LOAD_TEST_VUS || '20' }}
          DURATION: ${{ vars.LOAD_TEST_DURATION || '10m' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: load-test-results
          path: results/
          retention-days: 30

      - name: Analyze results
        run: |
          echo "Analyzing load test results..."
          # Add custom analysis script here if needed

      - name: Fail if thresholds breached
        run: |
          # k6 exits with non-zero if thresholds fail
          # This step will automatically fail the job
          exit $?

  # ===========================================================================
  # Job 4: Stress Tests (Manual or scheduled)
  # ===========================================================================
  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    needs: lint
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.test_type == 'stress'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: ${{ env.K6_VERSION }}

      - name: Run stress test
        run: |
          k6 run \
            --out json=results/stress-results.json \
            --env ENV=${{ github.event.inputs.environment || 'sit' }} \
            scripts/stress/api_stress.ts
        env:
          BASE_URL: ${{ secrets.BASE_URL_SIT }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: stress-test-results
          path: results/
          retention-days: 30

  # ===========================================================================
  # Job 5: Notification (on failure)
  # ===========================================================================
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [smoke-test, load-test, stress-test]
    if: failure()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "❌ Performance Test Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Performance Test Failed*\n\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref }}\nRun: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

